<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Propose Day 💍</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
      font-family: 'Pacifico', cursive;
      position: relative;
    }

    h1 {
      position: absolute;
      top: 30px;
      font-size: 34px;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* Question box */
    #question-box {
      background: rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    #question-box p {
      font-size: 20px;
      margin-bottom: 15px;
    }

    input {
      padding: 10px;
      border-radius: 12px;
      border: none;
      outline: none;
      width: 200px;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: #ff3b6f;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    /* Balloon area */
    #balloon-container {
      display: none;
      flex-direction: column;
      align-items: center;
      cursor: none;
    }

    #helper {
      margin-bottom: 15px;
      animation: pulse 1.5s infinite;
      font-size: 18px;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    #balloon {
      font-size: 170px;
      cursor: none;
    }

    /* Love letter */
    #letter {
      display: none;
      background: white;
      color: #ff3b6f;
      padding: 25px;
      border-radius: 18px;
      width: 280px;
      margin-top: 20px;
      font-size: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Needle cursor */
    body.needle {
      cursor: url('data:image/svg+xml;utf8,\
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">\
      <line x1="2" y1="30" x2="30" y2="2" stroke="black" stroke-width="2"/>\
      </svg>') 16 16, auto;
    }

    /* Next button */
    #next-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      padding: 14px 22px;
      border-radius: 30px;
      border: none;
      background: #ff3b6f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: none;
      animation: pop 1.5s infinite;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<h1>Happy Propose Day 💍</h1>

<!-- Question -->
<div id="question-box">
  <p>Sleep or Party? 😌</p>
  <input type="text" id="answer" placeholder="Type your answer">
  <br>
  <button onclick="checkAnswer()">Submit 💖</button>
</div>

<!-- Balloon -->
<div id="balloon-container">
  <div id="helper">Pop it with the needle 🪡</div>
  <div id="balloon" onclick="popBalloon()">🎈</div>

  <div id="letter">
    My love 💌<br><br>
    From choosing sleep over parties<br>
    to choosing me every day,<br>
    you already have my heart 💕<br><br>
    Will you be mine? 💍
  </div>
</div>

<button id="next-btn" onclick="goNext()">Next 💝</button>

<script>
  function checkAnswer() {
    const ans = document.getElementById("answer").value.toLowerCase().trim();
    if (ans === "sleep") {
      document.getElementById("question-box").style.display = "none";
      document.getElementById("balloon-container").style.display = "flex";
      document.body.classList.add("needle");
    } else {
      alert("Wrong 😌 think again");
    }
  }

  function popBalloon() {
    playPopSound();
    document.getElementById("balloon").style.display = "none";
    document.getElementById("helper").style.display = "none";
    document.getElementById("letter").style.display = "block";
    document.getElementById("next-btn").style.display = "block";
    document.body.classList.remove("needle");
  }

  function playPopSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }
function goNext() {
  window.location.href = "chocolate.html";
}

</script>

</body>
</html>
