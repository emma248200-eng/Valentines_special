<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day 💋</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background: linear-gradient(to top, #ff9ecf, #ffc2dd, #ffd6ea);
  height:100vh;
  overflow:hidden;
}

/* ===== Question Box ===== */

#questionPage{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.questionBox{
  background:#ffb6d9;
  padding:30px 35px;
  border-radius:25px;
  text-align:center;
  width:300px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.questionBox h2{
  font-family:'Pacifico',cursive;
  font-size:22px;
  color:#c2185b;
  margin-bottom:15px;
}

input{
  padding:8px;
  border:none;
  border-radius:10px;
  width:90%;
  outline:none;
  margin-bottom:10px;
}

button{
  padding:8px 18px;
  border:none;
  border-radius:15px;
  background:#ff4d94;
  color:white;
  cursor:pointer;
  font-weight:600;
}

#error{
  color:red;
  font-size:12px;
  margin-top:5px;
}

/* ===== Flashcard Page ===== */

#flashPage{
  display:none;
  height:100vh;
  padding:40px 20px;
  text-align:center;
  background: linear-gradient(to bottom, #ff85c1, #ffb6e6);
  overflow:auto;
}

#flashPage h1{
  font-family:'Pacifico',cursive;
  color:white;
  margin-bottom:30px;
}

.cardContainer{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  width:150px;
  height:200px;
  perspective:1000px;
}

.innerCard{
  width:100%;
  height:100%;
  transition:transform 0.6s;
  transform-style:preserve-3d;
  position:relative;
  cursor:pointer;
}

.card.flipped .innerCard{
  transform:rotateY(180deg);
}

.front, .back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:600;
  padding:10px;
}

.front{
  background:#ff4da6;
  color:white;
}

.back{
  background:white;
  transform:rotateY(180deg);
}

.back img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:20px;
}

/* Next Button */
.nextBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:10px 20px;
  background:#ff1493;
  border-radius:20px;
  color:white;
  text-decoration:none;
  font-weight:600;
}

</style>
</head>
<body>

<!-- Question Page -->
<div id="questionPage">
  <div class="questionBox">
    <h2>Where do you wanna get kissed the most? 💋</h2>
    <input type="text" id="answer" placeholder="Type your answer...">
    <br>
    <button onclick="checkAnswer()">Submit</button>
    <div id="error"></div>
  </div>
</div>

<!-- Flashcard Page -->
<div id="flashPage">
  <h1>Where u want me to kiss you 💕</h1>

  <div class="cardContainer">

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Neck</div>
        <div class="back">
          <img src="https://i.pinimg.com/736x/4f/07/6e/4f076e70e1ec3f111869989bb0952701.jpg">
        </div>
      </div>
    </div>

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Lips</div>
        <div class="back">
          <img src="https://i.pinimg.com/1200x/ef/0b/3f/ef0b3f9f3c8870825cad625fc0d51e99.jpg">
        </div>
      </div>
    </div>

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Cheeks</div>
        <div class="back">
          <img src="https://i.pinimg.com/736x/cd/8e/57/cd8e570f0ad0e5c31a6ade4e25de6548.jpg">
        </div>
      </div>
    </div>

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Forehead</div>
        <div class="back">
          <img src="https://i.pinimg.com/1200x/be/1a/fd/be1afd31ab3df7af4621e7d8f4c48e2e.jpg">
        </div>
      </div>
    </div>

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Hands</div>
        <div class="back">
          <img src="https://i.pinimg.com/736x/a1/91/d8/a191d8fe501a8450e771ab3d6bb12fa7.jpg">
        </div>
      </div>
    </div>

    <div class="card" onclick="flip(this)">
      <div class="innerCard">
        <div class="front">Ears</div>
        <div class="back">
          <img src="https://i.pinimg.com/1200x/0a/52/df/0a52df884c8bc92729de61d9b78ba4fc.jpg">
        </div>
      </div>
    </div>

  </div>

  <a href="valentines.html" class="nextBtn">Next ➜</a>

</div>

<script>
function checkAnswer(){
  let ans = document.getElementById("answer").value.toLowerCase().trim();
  if(ans === "neck"){
    document.getElementById("questionPage").style.display="none";
    document.getElementById("flashPage").style.display="block";
  } else {
    document.getElementById("error").innerText="Hint: It's soft and sensitive 😉";
  }
}

function flip(card){
  card.classList.toggle("flipped");
}
</script>

</body>
</html>
