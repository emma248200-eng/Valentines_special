<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Cutie ❤️</title>

  <!-- Handwriting font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* Center content */
    .content {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      flex-direction: column;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: white;
      text-shadow: 0 5px 15px rgba(0,0,0,0.25);
      margin-bottom: 40px;
    }

    /* Floating hearts */
    .hearts span {
      position: absolute;
      bottom: -20px;
      font-size: 22px;
      animation: float 12s linear infinite;
      opacity: 0.6;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }

    /* Next button */
    .next-btn {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 15px 28px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="hearts"></div>

  <!-- Main content -->
  <div class="content">
    <h1 id="text"></h1>

    <button class="next-btn" onclick="goToRose()">
      Next 🌹
    </button>
  </div>

  <script>
    /* Typing effect */
    const message = "A beautiful Valentine’s Week for my cutie ❤️";
    let i = 0;

    function typeText() {
      if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeText, 90);
      }
    }
    typeText();

    /* Floating hearts generator */
    const hearts = document.querySelector(".hearts");
    for (let i = 0; i < 25; i++) {
      const span = document.createElement("span");
      span.innerHTML = "❤️";
      span.style.left = Math.random() * 100 + "vw";
      span.style.animationDuration = 8 + Math.random() * 8 + "s";
      hearts.appendChild(span);
    }

    /* Go to Rose page */
    function goToRose() {
      window.location.href = "rose.html";
    }
  </script>

</body>
</html>
