<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rose Day 🌹</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pacifico', cursive;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
    }

    /* MAIN CONTENT (locked initially) */
    #mainContent {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      position: absolute;
      top: 30px;
      width: 100%;
      font-size: 36px;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    #helper {
      position: absolute;
      top: 90px;
      width: 100%;
      font-size: 18px;
      opacity: 0.85;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* ROSE */
    #rose-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    #rose {
      font-size: 150px;
      transition: transform 1.2s ease, filter 1.2s ease;
    }

    #rose.bloom {
      transform: scale(1.4) rotate(6deg);
      filter: drop-shadow(0 0 30px rgba(255, 0, 100, 0.8));
    }

    #rose-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 230px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 1.3s ease;
      pointer-events: none;
    }

    #rose-message.show {
      opacity: 1;
    }

    /* NEXT BUTTON */
    #nextBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #ff3b6f;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: none;
      animation: pop 1.5s infinite;
    }

    @keyframes pop {
      50% { transform: scale(1.08); }
    }

    /* QUESTION POPUP */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .box {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 18px;
      width: 300px;
      text-align: center;
    }

    .box input {
      width: 90%;
      padding: 8px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .box button {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* FLOATING HEARTS */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: float 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }
  </style>
</head>

<body>

  <!-- QUESTION FIRST -->
  <div class="popup" id="questionPopup">
    <div class="box">
      <p>Which is my favourite anime female lead? 😌</p>
      <input id="answer" placeholder="Your answer">
      <button onclick="unlockPage()">Unlock 🌹</button>
    </div>
  </div>

  <!-- MAIN ROSE CONTENT -->
  <div id="mainContent">
    <h1>Happy Rose Day, my cutie 🌹</h1>
    <div id="helper">Click the rose 🌹</div>

    <div id="rose-container" onclick="bloomRose()">
      <div id="rose">🥀</div>
      <div id="rose-message">
        For my cutie 💖<br>
        Just like this rose,<br>
        my love blooms only for you 🌸
      </div>
    </div>

    <button id="nextBtn" onclick="goNext()">Next 💍</button>
  </div>

  <script>
    /* Hearts */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "💖";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = Math.random() * 4 + 6 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }, 300);

    /* Unlock page */
    function unlockPage() {
      const ans = document.getElementById("answer").value
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "");

      if (ans === "maomao") {
        document.getElementById("questionPopup").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        alert("Wrong dumbass 😭 try again");
      }
    }

    /* Bloom rose */
    function bloomRose() {
      const rose = document.getElementById("rose");
      rose.innerHTML = "🌹";
      rose.classList.add("bloom");
      document.getElementById("rose-message").classList.add("show");
      document.getElementById("helper").style.display = "none";
      document.getElementById("nextBtn").style.display = "block";
      document.getElementById("rose-container").onclick = null;
    }

    /* Next page */
    function goNext() {
      window.location.href = "propose.html";
    }
  </script>

</body>
</html>
