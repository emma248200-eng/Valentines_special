<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Garden</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family: 'Georgia', serif;
  height:100vh;
  background: linear-gradient(to top, #ff9ecf, #ffc2dd, #ffd6ea);
}

/* Sky */
.sky{
  position:absolute;
  top:0;
  width:100%;
  height:60%;
  background: radial-gradient(circle at center, #ff85c1 0%, #ffb3d9 40%, transparent 70%);
}

/* Heart Sun */
.sun{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%) rotate(-45deg);
  width:120px;
  height:120px;
  background:#ff4d94;
  box-shadow:0 0 60px #ff4d94;
}
.sun:before,
.sun:after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  background:#ff4d94;
  border-radius:50%;
}
.sun:before{ top:-60px; left:0; }
.sun:after{ left:60px; top:0; }

/* Instruction */
#instruction{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  font-size:24px;
  color:#7a003c;
  font-weight:bold;
  text-shadow:1px 1px 5px white;
}

/* Garden */
.garden{
  position:absolute;
  bottom:0;
  width:100%;
  height:60%;
  background:linear-gradient(to top, #0f5c2e, #1e7c3a);
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-end;
  padding-bottom:30px;
}

/* Roses */
.rose{
  width:45px;
  height:45px;
  margin:10px;
  position:relative;
  cursor:pointer;
  animation:sway 3s infinite ease-in-out;
}

.rose::before{
  content:"🌹";
  font-size:45px;
}

@keyframes sway{
  0%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
  100%{transform:rotate(-3deg);}
}

/* Secret Rose Glow */
.secret{
  filter: drop-shadow(0 0 8px gold);
}

/* Tiny visible paper */
.secret::after{
  content:"📜";
  position:absolute;
  top:-10px;
  right:-5px;
  font-size:16px;
  transform:rotate(15deg);
}

/* Letter Popup */
#letter{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:320px;
  background:#fff0f5;
  padding:25px;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  transition:0.5s ease;
  text-align:center;
}

#letter h2{
  margin-top:0;
  color:#c2185b;
}

/* Next Button */
#nextBtn{
  position:absolute;
  bottom:20px;
  right:20px;
  padding:12px 25px;
  background:#ff4d94;
  color:white;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:0.3s;
}

#nextBtn:hover{
  background:#e60073;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="sky"></div>
<div class="sun"></div>

<div id="instruction">
  {ROSE DAY} <br>
  🌹 Find the note in these roses 🌹
</div>

<div class="garden" id="garden"></div>

<div id="letter">
  <h2>My Love ❤️</h2>
  <p>
  All the other flowers seem dull in front of you.<br><br>
    For me you're the most handsome/beautiful flower Shubhu.<br><br>
    I love you so much babyyy.
  </p>
</div>

<button id="nextBtn" onclick="goNext()">Next →</button>

<script>
const garden = document.getElementById("garden");
const totalRoses = 120;
const secretIndex = Math.floor(Math.random() * totalRoses);

for(let i=0; i<totalRoses; i++){
  let rose = document.createElement("div");
  rose.classList.add("rose");

  if(i === secretIndex){
    rose.classList.add("secret");
    rose.addEventListener("click", ()=>{
      document.getElementById("letter").style.transform =
      "translate(-50%,-50%) scale(1)";
    });
  }

  garden.appendChild(rose);
}

function goNext(){
  window.location.href = "propose.html";
}
</script>

</body>
</html>
