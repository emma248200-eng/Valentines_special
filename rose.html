<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rose Day 🌹</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pacifico', cursive;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
      position: relative;
    }

    h1 {
      position: absolute;
      top: 30px;
      font-size: 36px;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    #helper {
      position: absolute;
      top: 90px;
      font-size: 18px;
      opacity: 0.85;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% { opacity: 1; }
    }

    /* Rose content (LOCKED INITIALLY) */
    #mainContent {
      display: none;
    }

    #rose {
      font-size: 150px;
      cursor: pointer;
      transition: transform 1.2s ease, filter 1.2s ease;
    }

    #rose.bloom {
      transform: scale(1.4);
      filter: drop-shadow(0 0 30px rgba(255, 0, 100, 0.8));
    }

    #rose-message {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #rose-message.show {
      opacity: 1;
    }

    /* Question popup (VISIBLE ON LOAD) */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .box {
      background: white;
      color: #ff4d6d;
      padding: 25px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
    }

    .box input {
      width: 90%;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin: 12px 0;
      font-family: sans-serif;
    }

    .box button {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: float 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      to { transform: translateY(-120vh); }
    }
  </style>
</head>

<body>

  <!-- QUESTION FIRST -->
  <div class="popup" id="questionPopup">
    <div class="box">
      <p>Which is my favourite anime female lead? 👀</p>
      <input id="answer" placeholder="Your answer">
      <button onclick="unlockPage()">Unlock 🌹</button>
    </div>
  </div>

  <!-- MAIN ROSE CONTENT (LOCKED) -->
  <div id="mainContent">
    <h1>Happy Rose Day, my cutie 🌹</h1>
    <div id="helper">Click the rose 🌹</div>

    <div onclick="bloomRose()">
      <div id="rose">🥀</div>
      <div id="rose-message">
        For my cutie 💖<br>
        Just like this rose,<br>
        my love blooms only for you 🌸
      </div>
    </div>
  </div>

  <script>
    /* Floating hearts */
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }, 300);

    function unlockPage() {
      const ans = document.getElementById("answer").value
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "");

      if (ans === "maomao") {
        document.getElementById("questionPopup").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        alert("Wrong dumbass 😭 try again");
      }
    }

    function bloomRose() {
      document.getElementById("rose").innerHTML = "🌹";
      document.getElementById("rose").classList.add("bloom");
      document.getElementById("rose-message").classList.add("show");
      document.getElementById("helper").style.display = "none";
    }
  </script>

</body>
</html>
