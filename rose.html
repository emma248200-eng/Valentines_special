<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rose Day 🌹</title>

  <!-- Handwriting font -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pacifico', cursive;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff6a88, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
      position: relative;
    }

    h1 {
      position: absolute;
      top: 30px;
      font-size: 36px;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* Helper message */
    #helper {
      position: absolute;
      top: 90px;
      font-size: 18px;
      opacity: 0.85;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Rose container */
    #rose-container {
      position: relative;
      cursor: pointer;
    }

    #rose {
      font-size: 150px;
      transition: transform 1.2s ease, filter 1.2s ease;
    }

    #rose.bloom {
      transform: scale(1.4) rotate(6deg);
      filter: drop-shadow(0 0 30px rgba(255, 0, 100, 0.8));
    }

    /* Message on rose */
    #rose-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 230px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 1.3s ease;
      text-shadow: 0 0 6px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    #rose-message.show {
      opacity: 1;
    }

    /* Next button */
    #next-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #ff3b6f;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: none;
      animation: pop 1.5s infinite;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: float 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }
  </style>
</head>

<body>

  <h1>Happy Rose Day, my cutie 🌹</h1>
  <div id="helper">Click the rose 🌹</div>

  <div id="rose-container" onclick="bloomRose()">
    <div id="rose">🥀</div>

    <div id="rose-message">
      For my cutie 💖<br>
      Just like this rose,<br>
      my love blooms only for you 🌸
    </div>
  </div>

  <button id="next-btn" onclick="goNext()">Click for the next 💕</button>

  <script>
    /* Floating hearts */
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 300);

    /* Rose bloom */
    function bloomRose() {
      const rose = document.getElementById("rose");
      const msg = document.getElementById("rose-message");
      const helper = document.getElementById("helper");
      const nextBtn = document.getElementById("next-btn");

      rose.innerHTML = "🌹";
      rose.classList.add("bloom");
      msg.classList.add("show");
      helper.style.display = "none";
      nextBtn.style.display = "block";

      document.getElementById("rose-container").onclick = null;
    }

    function goToQuestion() {
    window.location.href = "question.html";
  }
  </script>

</body>
</html>
